<!-- Made with Brush, from the makers of Playcut: https://playcut.ai -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- The mark: a coffee bean whose crease is a flame. The bean takes the
         use's fill; the flame takes its color, so one symbol covers every variant. -->
    <symbol id="bean" viewBox="-110 -130 220 260">
      <g transform="rotate(-28)">
        <ellipse rx="92" ry="128"/>
        <path fill="currentColor" d="M8 -100 C30 -64 44 -30 40 6 C37 42 20 72 -2 84 C-24 74 -38 46 -36 14 C-34 -18 -12 -36 -4 -58 C0 -70 6 -84 8 -100 Z"/>
        <path d="M2 -10 C14 8 18 30 12 48 C8 60 0 66 -4 68 C-14 60 -20 46 -18 30 C-16 12 -6 4 2 -10 Z"/>
      </g>
    </symbol>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e8643a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8643a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="#f6f1ea"/>

  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="56" font-size="12" font-weight="700" letter-spacing="4" fill="#9a7b62">EMBER COFFEE ROASTERS — IDENTITY</text>
    <text x="752" y="56" text-anchor="end" font-size="12" fill="#b8a898">v1 · Sep 2026</text>
  </g>

  <!-- primary mark -->
  <circle cx="200" cy="236" r="150" fill="url(#glow)">
    <animate attributeName="r" values="140;158;140" dur="4s" repeatCount="indefinite"/>
  </circle>
  <use href="#bean" x="90" y="106" width="220" height="260" fill="#2b1d16" color="#e8643a"/>

  <!-- horizontal lockup -->
  <use href="#bean" x="372" y="190" width="66" height="78" fill="#2b1d16" color="#e8643a"/>
  <text x="452" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#2b1d16">Ember</text>
  <text x="455" y="278" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#9a7b62">COFFEE ROASTERS</text>
  <text x="374" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#6b5a4d">The crease of the bean is an ember.</text>

  <line x1="48" y1="392" x2="752" y2="392" stroke="#2b1d16" stroke-opacity="0.12"/>

  <!-- variants -->
  <rect x="48" y="424" width="96" height="96" rx="22" fill="#2b1d16"/>
  <use href="#bean" x="68" y="436" width="56" height="72" fill="#e8643a" color="#2b1d16"/>

  <rect x="168" y="424" width="96" height="96" rx="22" fill="#ffffff" stroke="#e6ddd2"/>
  <use href="#bean" x="188" y="436" width="56" height="72" fill="#111111" color="#ffffff"/>

  <rect x="288" y="424" width="96" height="96" rx="22" fill="#e8643a"/>
  <use href="#bean" x="308" y="436" width="56" height="72" fill="#f6f1ea" color="#e8643a"/>

  <rect x="408" y="424" width="96" height="96" rx="22" fill="#ffffff" stroke="#e6ddd2"/>
  <use href="#bean" x="428" y="460" width="20" height="24" fill="#2b1d16" color="#e8643a"/>
  <use href="#bean" x="462" y="464" width="14" height="16" fill="#2b1d16" color="#e8643a"/>

  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8a7a6a" text-anchor="middle">
    <text x="96" y="548">App icon</text>
    <text x="216" y="548">One color</text>
    <text x="336" y="548">Reversed</text>
    <text x="456" y="548">20 / 16 px</text>
  </g>

  <!-- palette -->
  <circle cx="588" cy="472" r="26" fill="#2b1d16"/>
  <circle cx="660" cy="472" r="26" fill="#e8643a"/>
  <circle cx="732" cy="472" r="26" fill="#f6f1ea" stroke="#e6ddd2"/>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="588" y="548" fill="#8a7a6a">Dark roast</text>
    <text x="660" y="548" fill="#8a7a6a">Ember</text>
    <text x="732" y="548" fill="#8a7a6a">Crema</text>
    <text x="588" y="566" fill="#b8a898" font-size="11">#2B1D16</text>
    <text x="660" y="566" fill="#b8a898" font-size="11">#E8643A</text>
    <text x="732" y="566" fill="#b8a898" font-size="11">#F6F1EA</text>
  </g>
</svg>
